name = "disvr"
main = "src/index.ts"
compatibility_date = "2026-03-02"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Custom domains
routes = [
  { pattern = "www.disvr.top", custom_domain = true },
  { pattern = "api.disvr.top", custom_domain = true },
]

[[d1_databases]]
binding = "DB"
database_name = "disvr-db"
database_id = "da8fa0ee-8b1f-49fe-90f1-f7ef85731744"

[[vectorize]]
binding = "VECTORIZE"
index_name = "disvr-mcp-index"

[vars]
ENVIRONMENT = "production"

# Hourly crawl trigger
[triggers]
crons = ["0 * * * *"]

# MCP Server via Durable Objects
[durable_objects]
bindings = [
  { name = "MCP_AGENT", class_name = "DisvrMcpAgent" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DisvrMcpAgent"]
